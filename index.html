<style>
  :root{--bg:#0E0E0E;--fg:#E5E5E5;--fg-mute:#888888;--border-strong:#3A3A3A;--c-teal:#6DC7C8;color-scheme:dark}
  :root[data-theme="light"]{--bg:#FAFAF7;--fg:#1A1A1A;--fg-mute:#5C5C5C;--border-strong:#BDBDB7;--c-teal:#1D7677;color-scheme:light}
  html{background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
  body{margin:0;padding:27.5px 30px;font-size:15px;line-height:1.55;letter-spacing:.01em}
  p{color:var(--fg-mute)}
  a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--border-strong)}
  a:hover{border-bottom-color:var(--c-teal)}
</style>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
